<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student Management System</h2>

<input type="text" id="name" placeholder="Enter Name">
<input type="text" id="roll" placeholder="Enter Roll No">

<select id="branch">
    <option value="">Select Branch</option>
    <option>CSE</option>
    <option>Data Science</option>
    <option>AIML</option>
    <option>IT</option>
</select>

<button onclick="addStudent()">Add Student</button>

<br><br>

<input type="text" id="search" placeholder="Search by Name" onkeyup="showStudents()">

<select id="filter" onchange="showStudents()">
    <option value="All">All Branches</option>
    <option>CSE</option>
    <option>Data Science</option>
    <option>AIML</option>
    <option>IT</option>
</select>

<h3>Total Students: <span id="total"></span></h3>

<table border="1">
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll no.</th>
            <th>Branch</th>
            <th>Delete entry</th>
        </tr>
    </thead>

    <tbody id="table"></tbody>
</table>

<p id="message"></p>

<script src="script.js"></script>

</body>
</html>
