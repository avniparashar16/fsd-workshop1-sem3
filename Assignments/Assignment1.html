<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FSD Quiz</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="Assignment1.css">

</head>


<body>

    <div class="container">


        <!-- =========================
             START PAGE
        ========================== -->

        <div id="startPage">

            <h1>FSD Quiz</h1>

            <p class="subtitle">
                Full Stack Development Quiz
            </p>

            <form id="studentForm">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >


                <label for="rollno">
                    Roll No
                </label>

                <input
                    type="text"
                    id="rollno"
                    placeholder="Enter your roll no"
                    required
                >


                <label for="section">
                    Section
                </label>

                <select id="section">

                    <option value="A">A</option>

                    <option value="B">B</option>

                    <option value="C">C</option>

                </select>


                <button type="submit">
                    Start Quiz
                </button>

            </form>

        </div>



        <!-- =========================
             QUIZ PAGE
        ========================== -->

        <div id="quizPage">

            <div class="quiz-heading">

                <h1>FSD Quiz</h1>

                <div class="timer">
                    Time Left:
                    <span id="timer">02:00</span>
                </div>

            </div>


            <p id="questionNumber">
                Question 1 of 10
            </p>


            <h2 id="question">
                Question will appear here
            </h2>


            <!-- Options will be added by JavaScript -->

            <div id="options" class="options"></div>


            <p id="answerMessage"></p>


            <div class="button-area">

                <button
                    id="nextButton"
                    onclick="nextQuestion()"
                    disabled
                >
                    Next
                </button>


                <button
                    id="submitButton"
                    onclick="submitQuiz()"
                >
                    Submit
                </button>

            </div>

        </div>



        <!-- =========================
             RESULT PAGE
        ========================== -->

        <div id="resultPage">

            <h1>Quiz Completed!</h1>

            <p id="studentResult"></p>

            <p>
                Roll No:
                <span id="resultRollNo"></span>
            </p>

            <p>
                Section:
                <span id="resultSection"></span>
            </p>


            <div class="score">

                <p>Your Score</p>

                <h2 id="finalScore">
                    0 / 10
                </h2>

            </div>


            <p id="message"></p>


            <button onclick="restartQuiz()">
                Try Again
            </button>

        </div>

    </div>


    <!-- Connect JavaScript -->

    <script src="Assignment1.js"></script>

</body>

</html>
